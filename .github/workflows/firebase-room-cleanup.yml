name: Firebase multiplayer room cleanup

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-room-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Firebase Admin SDK
        run: npm install --prefix functions --no-save firebase-admin@^12.7.0
      - name: Remove rooms and matches inactive for one hour
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PLAY_HUB_688E }}
        run: node functions/cleanup-rooms.js
