<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlayHub - Discover Games</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
 background:#0c1020;
 color:white;
 font-family:Arial,sans-serif;
 min-height:100vh;
}

header{
 display:flex;
 justify-content:space-between;
 align-items:center;
 padding:18px 6%;
 background:#151b30;
 border-bottom:1px solid #29314b;
}

.logo{font-size:27px;font-weight:bold;color:#65d8ff}
nav a{color:white;text-decoration:none;margin-left:18px}

.hero{
 padding:55px 6% 35px;
 background:linear-gradient(120deg,#192b50,#34205d);
}

.hero h1{font-size:clamp(30px,6vw,48px);margin-bottom:12px}
.hero p{color:#c8d5f0;font-size:16px}

.search-area{padding:25px 6%}
#search{
 width:100%;max-width:550px;
 padding:15px;border-radius:10px;
 border:1px solid #465273;
 background:#171e33;color:white;
 font-size:16px;
}

.section{padding:10px 6% 50px}
.section h2{font-size:25px;margin-bottom:20px}

#games{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
 gap:20px;
}

.game-card{
 background:#171e33;
 border:1px solid #303b5b;
 border-radius:15px;
 overflow:hidden;
 transition:.2s;
}

.game-card:hover{
 transform:translateY(-5px);
 border-color:#65d8ff;
}

.game-cover{
 height:145px;
 display:flex;
 justify-content:center;
 align-items:center;
 font-size:65px;
 background:linear-gradient(135deg,#253d70,#49316c);
}

.game-info{padding:17px}
.game-info h3{font-size:21px;margin-bottom:9px}
.game-info p{color:#aebbd5;font-size:14px;margin-bottom:16px}

.play-btn{
 display:block;text-align:center;
 background:#287cff;color:white;
 padding:12px;border-radius:9px;
 text-decoration:none;font-weight:bold;
}

.status{
 text-align:center;
 color:#b7c6e5;
 padding:35px 10px;
}

footer{
 padding:25px;text-align:center;
 color:#8795b3;border-top:1px solid #29314b;
}

@media(max-width:500px){
 header{padding:15px 5%}
 nav a{margin-left:8px;font-size:13px}
 .hero{padding:40px 5%}
 .section,.search-area{padding-left:5%;padding-right:5%}
}
</style>
</head>

<body>

<header>
 <div class="logo">🎮 PlayHub</div>
 <nav>
  <a href="./">Home</a>
  <a href="#games-section">Games</a>
 </nav>
</header>

<section class="hero">
 <h1>Discover Your Next Game</h1>
 <p>Play amazing games. Explore new worlds. Have fun!</p>
</section>

<div class="search-area">
 <input id="search" type="search"
 placeholder="Search games..."
 aria-label="Search games">
</div>

<section class="section" id="games-section">
 <h2>🔥 All Games</h2>

 <div id="games">
  <div class="status">Loading games...</div>
 </div>
</section>

<footer>
 © 2026 PlayHub. All rights reserved.
</footer>

<script>
const gamesContainer = document.getElementById("games");
const searchInput = document.getElementById("search");

let allGames = [];

function formatName(slug){
 return slug
  .replace(/[-_]/g," ")
  .replace(/\b\w/g,letter=>letter.toUpperCase());
}

function renderGames(list){
 gamesContainer.innerHTML = "";

 if(list.length === 0){
  gamesContainer.innerHTML =
   '<div class="status">No games found.</div>';
  return;
 }

 list.forEach(game=>{
  const card = document.createElement("article");
  card.className = "game-card";

  const cover = document.createElement("div");
  cover.className = "game-cover";
  cover.textContent = "🎮";

  const info = document.createElement("div");
  info.className = "game-info";

  const title = document.createElement("h3");
  title.textContent = game.name;

  const description = document.createElement("p");
  description.textContent = "Ready to play? Explore this game on PlayHub.";

  const link = document.createElement("a");
  link.className = "play-btn";
  link.href = game.path;
  link.textContent = "▶ PLAY NOW";

  info.append(title,description,link);
  card.append(cover,info);
  gamesContainer.appendChild(card);
 });
}

async function loadGames(){
 try{
  const api =
   "https://api.github.com/repos/Ranit-rex/test-Gameonix/git/trees/main?recursive=1";

  const response = await fetch(api);

  if(!response.ok){
   throw new Error("GitHub API error: "+response.status);
  }

  const data = await response.json();

  if(!data.tree){
   throw new Error("Game folder list not found");
  }

  const gameFiles = data.tree.filter(item=>{
   return item.type === "blob" &&
    /^games\/[^/]+\/index\.html$/i.test(item.path);
  });

  allGames = gameFiles.map(file=>{
   const slug = file.path.split("/")[1];

   return {
    name:formatName(slug),
    path:"./"+file.path
   };
  });

  allGames.sort((a,b)=>a.name.localeCompare(b.name));

  renderGames(allGames);

 }catch(error){
  console.error(error);
  gamesContainer.innerHTML =
   '<div class="status">Games load nahi ho paaye. Internet check karke page refresh karo.</div>';
 }
}

searchInput.addEventListener("input",()=>{
 const query = searchInput.value.toLowerCase();

 const filtered = allGames.filter(game=>
  game.name.toLowerCase().includes(query)
 );

 renderGames(filtered);
});

loadGames();
</script>

</body>
</html>
