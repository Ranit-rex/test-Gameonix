
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090b14">
<title>PlayHub — Play Beyond Limits</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

:root{
 --bg:#090b14;
 --panel:#111522;
 --panel2:#171c2d;
 --line:#252b40;
 --text:#f4f5ff;
 --muted:#929bb4;
 --purple:#895cff;
 --blue:#38a9ff;
}
*{box-sizing:border-box}
body{
 margin:0;background:var(--bg);color:var(--text);
 font-family:Inter,Arial,sans-serif;
 min-height:100vh;
}
button,input{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
#playhub-app{min-height:100vh}
.ph-layout{display:flex;min-height:100vh}
.ph-sidebar{
 width:235px;flex-shrink:0;position:fixed;
 top:0;bottom:0;left:0;z-index:20;
 background:#0d101b;border-right:1px solid var(--line);
 padding:26px 16px;display:flex;flex-direction:column;
}
.ph-brand{display:flex;align-items:center;gap:11px;
 padding:0 10px 30px;font-size:23px;font-weight:900}
.ph-logo{
 width:38px;height:38px;border-radius:12px;
 display:grid;place-items:center;
 background:linear-gradient(135deg,#a16bff,#397bff);
 box-shadow:0 5px 25px #825aff55;font-size:21px
}
.ph-side-label{
 color:#68718a;font-size:10px;font-weight:800;
 letter-spacing:1.7px;padding:12px 12px 9px
}
.ph-nav{
 display:flex;align-items:center;gap:13px;
 width:100%;padding:12px;border-radius:11px;
 color:#a4abc0;background:transparent;
 border:0;text-align:left;font-size:13px;
 font-weight:600;margin:2px 0
}
.ph-nav:hover,.ph-nav.active{
 background:#20213a;color:white
}
.ph-nav.active{box-shadow:inset 3px 0 #9a70ff}
.ph-nav-icon{font-size:18px;width:23px;text-align:center}
.ph-sidebar-bottom{margin-top:auto}
.ph-main{
 margin-left:235px;width:calc(100% - 235px);
 padding:0 36px 60px;min-width:0
}
.ph-topbar{
 height:84px;display:flex;align-items:center;
 justify-content:space-between;gap:18px;
 border-bottom:1px solid #ffffff0c;
}
.ph-search{
 width:min(430px,55vw);position:relative
}
.ph-search input{
 width:100%;padding:13px 17px 13px 43px;
 color:white;background:#151a29;
 border:1px solid var(--line);border-radius:12px;
 outline:none;font-size:13px
}
.ph-search input:focus{border-color:var(--purple)}
.ph-search-icon{
 position:absolute;left:15px;top:11px;
 color:#8c95ae;font-size:18px
}
.ph-top-right{display:flex;align-items:center;gap:12px}
.ph-online{
 border:1px solid #2c7552;background:#123225;
 color:#65e5a2;padding:8px 12px;border-radius:30px;
 font-size:11px;font-weight:700
}
.ph-avatar{
 width:39px;height:39px;border-radius:50%;
 display:grid;place-items:center;
 background:linear-gradient(135deg,#875bff,#28a9ef);
 font-weight:800
}
.ph-content{max-width:1450px;margin:auto}
.ph-welcome{padding:30px 0 18px}
.ph-eyebrow{
 color:#a78aff;font-size:11px;font-weight:800;
 letter-spacing:2px;text-transform:uppercase
}
.ph-welcome h1{
 font-size:clamp(25px,4vw,38px);
 margin:10px 0 7px;letter-spacing:-1.5px
}
.ph-welcome p{color:var(--muted);font-size:13px;margin:0}
.ph-hero{
 min-height:290px;position:relative;overflow:hidden;
 border-radius:22px;padding:35px;
 display:flex;align-items:center;
 background:
 radial-gradient(ellipse at 80% 20%,#965aff77,transparent 38%),
 radial-gradient(ellipse at 95% 100%,#158bd477,transparent 45%),
 linear-gradient(110deg,#242047,#111a36 65%,#172b4b);
 border:1px solid #ffffff18;
}
.ph-hero:after{
 content:"";position:absolute;width:330px;height:330px;
 right:8%;top:-25px;border-radius:50%;
 border:1px solid #ffffff18;
 box-shadow:0 0 0 30px #ffffff06,0 0 0 65px #ffffff04;
}
.ph-hero-content{position:relative;z-index:2;max-width:520px}
.ph-hero-tag{
 display:inline-flex;padding:7px 11px;border-radius:30px;
 background:#ffffff17;border:1px solid #ffffff25;
 font-size:10px;font-weight:800;letter-spacing:1px
}
.ph-hero h2{
 font-size:clamp(30px,5vw,48px);
 line-height:1.08;margin:17px 0 12px;
 letter-spacing:-1.8px
}
.ph-hero p{color:#c4c9df;font-size:13px;line-height:1.7}
.ph-hero button{
 border:0;border-radius:11px;padding:13px 19px;
 color:white;font-weight:800;margin-top:12px;
 background:linear-gradient(100deg,#9862ff,#497fff);
 box-shadow:0 8px 25px #865aff44
}
.ph-hero-art{
 position:absolute;right:11%;top:50%;
 transform:translateY(-50%);font-size:clamp(90px,16vw,175px);
 filter:drop-shadow(0 20px 35px #0008);z-index:1
}
.ph-section{margin-top:34px}
.ph-section-head{
 display:flex;justify-content:space-between;
 align-items:center;gap:15px;margin-bottom:17px
}
.ph-section h2{font-size:20px;margin:0;letter-spacing:-.5px}
.ph-section-sub{font-size:11px;color:var(--muted);margin-top:5px}
.ph-count{
 color:#a99aff;background:#292044;padding:6px 10px;
 border-radius:20px;font-size:11px;font-weight:800
}
.ph-categories{display:flex;gap:9px;flex-wrap:wrap;margin:20px 0}
.ph-category{
 padding:9px 15px;border-radius:30px;
 background:#151a29;border:1px solid var(--line);
 color:#aab1c5;font-size:12px;font-weight:700
}
.ph-category.active,.ph-category:hover{
 color:white;background:#33245a;border-color:#8058d8
}
.ph-games{
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
 gap:19px
}
.ph-card{
 background:var(--panel);border:1px solid var(--line);
 border-radius:16px;overflow:hidden;min-width:0;
 transition:transform .2s,border-color .2s
}
.ph-card:hover{
 transform:translateY(-5px);border-color:#7755c4
}
.ph-cover{
 width:100%;aspect-ratio:16/10;position:relative;
 background:linear-gradient(135deg,#29204b,#12344c);
 overflow:hidden;display:grid;place-items:center
}
.ph-cover img{width:100%;height:100%;object-fit:cover}
.ph-cover-fallback{font-size:55px;position:absolute}
.ph-card-body{padding:14px}
.ph-card-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ph-card h3{font-size:15px;margin:0;overflow-wrap:anywhere}
.ph-tag{
 color:#a999ff;background:#2b2246;
 border-radius:20px;padding:5px 8px;
 font-size:9px;font-weight:800;white-space:nowrap
}
.ph-card p{
 color:var(--muted);font-size:11px;line-height:1.6;
 min-height:35px;margin:10px 0 13px
}
.ph-play{
 width:100%;padding:10px;border-radius:9px;
 border:1px solid #7454c4;background:#30204e;
 color:white;font-weight:800;font-size:12px
}
.ph-play:hover{background:#754bce}
.ph-status{
 color:var(--muted);font-size:13px;
 padding:22px 0
}
.ph-empty{
 padding:35px;text-align:center;
 color:var(--muted);background:var(--panel);
 border:1px dashed var(--line);border-radius:16px;
 grid-column:1/-1
}
.ph-footer{
 margin-top:60px;padding-top:22px;
 border-top:1px solid var(--line);
 color:#707991;font-size:11px
}
.ph-game-view{
 position:fixed;inset:0;background:#05070d;z-index:50;
 display:flex;flex-direction:column
}
.ph-game-bar{
 height:57px;flex-shrink:0;background:#111522;
 display:flex;align-items:center;justify-content:space-between;
 gap:10px;padding:0 15px;border-bottom:1px solid var(--line)
}
.ph-game-bar strong{font-size:13px}
.ph-game-bar button{
 background:#262d43;border:1px solid #3a4562;
 color:white;border-radius:8px;padding:9px 12px;
 font-size:12px;font-weight:700
}
.ph-game-container{flex:1;min-height:0}
.ph-game-container iframe{width:100%;height:100%;border:0}
[hidden]{display:none!important}
@media(max-width:850px){
 .ph-sidebar{width:68px;padding:20px 8px}
 .ph-brand{padding:0 7px 25px}
 .ph-brand-name,.ph-nav-text,.ph-side-label{display:none}
 .ph-nav{justify-content:center;padding:13px 5px}
 .ph-main{margin-left:68px;width:calc(100% - 68px);padding:0 18px 40px}
 .ph-hero{padding:25px;min-height:260px}
 .ph-hero-art{right:3%;opacity:.55}
 .ph-hero-content{max-width:75%}
}
@media(max-width:540px){
 .ph-main{padding:0 13px 35px}
 .ph-topbar{height:68px}
 .ph-search{width:100%}
 .ph-online{display:none}
 .ph-welcome{padding:23px 0 15px}
 .ph-hero{min-height:245px;padding:22px}
 .ph-hero-content{max-width:100%}
 .ph-hero-art{right:-5%;top:15%;font-size:105px;opacity:.2}
 .ph-hero h2{font-size:32px}
 .ph-games{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
 .ph-card-body{padding:10px}
 .ph-card h3{font-size:12px}
 .ph-card p{font-size:10px;min-height:48px}
 .ph-play{font-size:11px}
 .ph-section h2{font-size:17px}
 .ph-avatar{width:34px;height:34px}
}
</style>

<script defer src="./engine/discovery.js"></script>
<script defer src="./engine/game-loader.js"></script>
<script defer src="./engine/ui.js"></script>
</head>

<body>
<div id="playhub-app">
  <div style="padding:40px;color:white">Loading PlayHub...</div>
</div>
</body>
</html>
