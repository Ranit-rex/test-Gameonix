
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlayHub | Discover Games</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0c1020;color:white;font-family:Arial,sans-serif;min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 6%;background:#151b30;border-bottom:1px solid #303a56}
.logo{font-size:27px;font-weight:bold;color:#65d8ff}
nav a{color:white;text-decoration:none;margin-left:18px}
.hero{padding:60px 6%;background:linear-gradient(120deg,#192b50,#40215e)}
.hero h1{font-size:clamp(30px,6vw,48px);margin-bottom:12px}
.hero p{color:#d0dcf5;font-size:16px}
.search-area{padding:25px 6%}
#search{width:100%;max-width:550px;padding:15px;border-radius:10px;border:1px solid #465273;background:#171e33;color:white;font-size:16px}
.section{padding:10px 6% 50px}
.section h2{font-size:25px;margin-bottom:22px}
#games{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.game-card{background:#171e33;border:1px solid #303b5b;border-radius:15px;overflow:hidden;transition:.2s}
.game-card:hover{transform:translateY(-5px);border-color:#65d8ff}
.cover{height:150px;display:flex;align-items:center;justify-content:center;font-size:65px;background:linear-gradient(135deg,#253d70,#49316c)}
.info{padding:17px}
.info h3{font-size:21px;margin-bottom:10px}
.info p{color:#b5c3dd;font-size:14px;margin-bottom:16px}
.play{display:block;text-align:center;background:#287cff;color:white;text-decoration:none;padding:12px;border-radius:9px;font-weight:bold}
.status{padding:35px 10px;color:#bac9e8}
footer{padding:25px;text-align:center;color:#8795b3;border-top:1px solid #29314b}
@media(max-width:500px){
header{padding:15px 5%}
nav a{margin-left:8px;font-size:13px}
.hero{padding:40px 5%}
.section,.search-area{padding-left:5%;padding-right:5%}
}
</style>
</head>
<body>

<header>
<div class="logo">🎮 PlayHub</div>
<nav>
<a href="./">Home</a>
<a href="#games-section">Games</a>
<a href="./games/clash-brawl/index.html">
</nav>
</header>

<section class="hero">
<h1>Discover Your Next Game 🎮</h1>
<p>Explore amazing games and start playing!</p>
</section>

<div class="search-area">
<input id="search" type="search" placeholder="Search games...">
</div>

<section class="section" id="games-section">
<h2>🔥 All Games</h2>
<div id="games">
<div class="status">Loading games...</div>
</div>
</section>

<footer>© 2026 PlayHub. All rights reserved.</footer>

<script>
const OWNER="Ranit-rex";
const REPO="test-Gameonix";
const BRANCH="main";

const container=document.getElementById("games");
const search=document.getElementById("search");
let allGames=[];

function gameName(slug){
return slug.replace(/[-_]/g," ")
.replace(/\b\w/g,c=>c.toUpperCase());
}

function renderGames(games){
container.innerHTML="";

if(!games.length){
container.innerHTML='<div class="status">No games found.</div>';
return;
}

games.forEach(game=>{
const card=document.createElement("article");
card.className="game-card";

const cover=document.createElement("div");
cover.className="cover";
cover.textContent="🎮";

const info=document.createElement("div");
info.className="info";

const title=document.createElement("h3");
title.textContent=game.name;

const description=document.createElement("p");
description.textContent="Ready to play? Enter the game world!";

const button=document.createElement("a");
button.className="play";
button.href=game.path;
button.textContent="▶ PLAY NOW";

info.append(title,description,button);
card.append(cover,info);
container.appendChild(card);
});
}

async function loadGames(){
try{
const url=`https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${BRANCH}?recursive=1`;

const response=await fetch(url,{
headers:{"Accept":"application/vnd.github+json"}
});

if(!response.ok){
throw new Error("GitHub API error: "+response.status);
}

const data=await response.json();

if(data.truncated){
throw new Error("Repository tree is too large.");
}

const files=data.tree.filter(item=>
item.type==="blob" &&
/^games\/[^/]+\/index\.html$/i.test(item.path)
);

allGames=files.map(file=>{
const slug=file.path.split("/")[1];

return {
name:gameName(slug),
path:`./games/${slug}/index.html`
};
});

allGames.sort((a,b)=>a.name.localeCompare(b.name));
renderGames(allGames);

}catch(error){
console.error(error);
container.innerHTML=
'<div class="status">Games load nahi ho paaye. Internet check karke refresh karo.</div>';
}
}

search.addEventListener("input",()=>{
const q=search.value.toLowerCase();
renderGames(allGames.filter(game=>
game.name.toLowerCase().includes(q)
));
});

loadGames();
</script>
</body>
</html>
