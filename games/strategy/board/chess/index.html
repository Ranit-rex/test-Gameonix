<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Chess Arena — Playovia</title><style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:#f4f6ff;font:15px system-ui}.wrap{max-width:980px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.panel{background:#1b2940;border:1px solid #344765;border-radius:16px;padding:14px;margin:12px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}button,input{font:inherit}button{border:0;border-radius:10px;padding:10px 14px;background:#8058ed;color:white;font-weight:800;cursor:pointer}.secondary{background:#34445f}.board{width:min(92vw,560px);aspect-ratio:1;display:grid;grid-template-columns:repeat(8,1fr);margin:14px auto;border:5px solid #604b36;border-radius:7px;overflow:hidden}.sq{display:grid;place-items:center;font-size:clamp(24px,7vw,52px);cursor:pointer;user-select:none}.light{background:#f0d9b5;color:#18202b}.dark{background:#9b6b4b;color:#fff}.sel{box-shadow:inset 0 0 0 5px #f5d547}.legal{background-image:radial-gradient(#36b96c 24%,transparent 27%)}.muted{color:#aab8d0;font-size:13px}input{background:#101827;color:white;border:1px solid #536783;padding:10px;border-radius:9px;width:120px}#lobby[hidden]{display:none}.roomjoin{margin:4px;background:#354765}</style></head><body><main class="wrap"><div class="top"><h1>♟ Chess Arena</h1><span class="muted">Solo vs AI · Online 1v1</span></div><section class="panel"><div class="actions"><button id="solo">Play vs AI</button><button id="new" class="secondary">New game</button><button id="flip" class="secondary">Flip board</button><button id="undo" class="secondary">Undo</button></div><p id="status">Choose a mode to begin.</p><div class="board" id="board"></div><p class="muted">Tap a piece, then its destination. AI responds after your move.</p></section><section class="panel"><h3>Online multiplayer</h3><div class="actions"><button id="create">Create room</button><input id="joinCode" maxlength="8" placeholder="Room code"><button id="join">Join</button><button id="start">Start match</button><button id="leave" class="secondary">Leave</button></div><p id="netStatus" class="muted">Connect when ready.</p><div id="lobby" hidden><b>Room: <span id="roomCode"></span></b><p id="roomMembers"></p></div><div id="roomList" class="muted"></div><button id="refresh" class="secondary">Find rooms</button></section></main><script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script><script src="../../../../shared/multiplayer.js"></script><script src="../online.js"></script><script>
const GAME_ID='playovia-chess',GAME_TITLE='Chess Arena';let game=new Chess(),selected=null,flip=false,mode='solo',myColor='w',remote=false;const pieces={'wK':'♔','wQ':'♕','wR':'♖','wB':'♗','wN':'♘','wP':'♙','bK':'♚','bQ':'♛','bR':'♜','bB':'♝','bN':'♞','bP':'♟'};function draw(){let b=document.getElementById('board');b.innerHTML='';let files=flip?'hgfedcba':'abcdefgh',ranks=flip?'12345678':'87654321';for(let r of ranks)for(let f of files){let sq=f+r,el=document.createElement('button');el.className='sq '+((files.indexOf(f)+ranks.indexOf(r))%2?'dark':'light')+(selected===sq?' sel':'');let p=game.get(sq);el.textContent=p?pieces[p.color+p.type.toUpperCase()]||'':'';el.onclick=()=>tap(sq);b.append(el)}document.getElementById('status').textContent=game.game_over()?(game.in_checkmate()?'Checkmate!': 'Draw!'):(game.turn()==='w'?'White':'Black')+' to move'+(game.in_check()?' · Check':'');}function tap(sq){if(mode==='multi'&&game.turn()!==myColor)return;let p=game.get(sq);if(selected){let m=game.move({from:selected,to:sq,promotion:'q'});selected=null;if(m){draw();if(mode==='multi')Net.send({fen:game.fen(),pgn:game.pgn(),last:m.san}).catch(()=>{});else if(!game.game_over())setTimeout(ai,250);return}}if(p&&p.color===game.turn())selected=sq;draw()}function ai(){let ms=game.moves();if(!ms.length)return;let best=ms[Math.floor(Math.random()*ms.length)];let capture=ms.filter(x=>x.includes('x'));if(capture.length&&Math.random()<.65)best=capture[Math.floor(Math.random()*capture.length)];game.move(best);draw()}function reset(){game.reset();selected=null;draw()}window.onRemoteState=v=>{if(mode==='multi'&&v.fen){game.load(v.fen);draw()}};document.getElementById('solo').onclick=()=>{mode='solo';myColor='w';reset()};document.getElementById('new').onclick=reset;document.getElementById('flip').onclick=()=>{flip=!flip;draw()};document.getElementById('undo').onclick=()=>{game.undo();if(mode==='solo')game.undo();draw()};document.getElementById('create').onclick=()=>Net.create().catch(e=>Net.status(e.message));document.getElementById('join').onclick=()=>Net.join(document.getElementById('joinCode').value.trim().toUpperCase()).then(()=>{mode='multi';myColor='b'}).catch(e=>Net.status(e.message));document.getElementById('start').onclick=()=>{mode='multi';myColor='w';reset();Net.start({fen:game.fen()}).catch(e=>Net.status(e.message))};document.getElementById('leave').onclick=()=>Net.leave().catch(()=>{});document.getElementById('refresh').onclick=()=>Net.rooms().catch(e=>Net.status(e.message));draw();</script></body></html>
