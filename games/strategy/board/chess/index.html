<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Chess Arena — Playovia</title>
<style>
:root{color-scheme:dark;--bg:#080d18;--panel:#121c2d;--line:#263750;--muted:#9fb0c8;--accent:#8b6cff;--gold:#ffc857}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -20%,#26375b 0%,#101a2b 42%,var(--bg) 78%);color:#f6f7ff;font:15px/1.5 Inter,system-ui,sans-serif}
.wrap{width:min(1100px,100%);margin:auto;padding:clamp(14px,3vw,30px)}
h1{font-size:clamp(26px,5vw,42px);letter-spacing:-1.5px;margin:0;font-weight:900}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:8px 0 22px}
.panel{background:linear-gradient(145deg,rgba(24,38,60,.97),rgba(13,23,39,.98));border:1px solid var(--line);border-radius:22px;padding:clamp(14px,2.5vw,24px);margin:14px 0;box-shadow:0 18px 55px #0005}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button,input,select{font:inherit}button{border:1px solid transparent;border-radius:12px;padding:11px 17px;background:linear-gradient(135deg,#9a79ff,#6545dc);color:white;font-weight:800;cursor:pointer;box-shadow:0 6px 18px #6045c933;transition:transform .15s,filter .15s}
button:hover{filter:brightness(1.12);transform:translateY(-1px)}button:active{transform:translateY(1px)}.secondary{background:#263852;border-color:#3a506f;box-shadow:none}
.muted{color:var(--muted);font-size:13px}#status,#turn{font-size:16px;font-weight:750;color:#fff;min-height:26px}
.board{width:min(92vw,610px);aspect-ratio:1;display:grid;grid-template-columns:repeat(8,1fr);margin:20px auto;border:8px solid #2d3d54;border-radius:13px;overflow:hidden;box-shadow:0 18px 48px #0008}
.sq{display:grid;place-items:center;border-radius:0;padding:0;font-size:clamp(24px,7.5vw,58px);cursor:pointer;user-select:none;box-shadow:none}
.light{background:#e8dfcc;color:#1b2738}.dark{background:#72917e;color:#fff}.sel{box-shadow:inset 0 0 0 5px #ffd34d}.legal{background-image:radial-gradient(#40c982 24%,transparent 27%)}
input,select{background:#0c1524;color:white;border:1px solid #3b506c;padding:11px 13px;border-radius:11px}
canvas{display:block;width:100%;max-height:68vh;touch-action:none;background:#075c43;border-radius:18px;border:10px solid #61452f;box-shadow:0 18px 48px #0008}
@media(max-width:600px){.wrap{padding:12px}.panel{border-radius:17px;padding:13px}.actions button{flex:1 1 auto}.board{border-width:5px}.sq{font-size:clamp(22px,8vw,42px)}}
</style></head><body><main class="wrap"><div class="top"><h1>♟ Chess Arena</h1><span class="muted">SOLO CAMPAIGN · VS AI</span></div><section class="panel"><div class="actions"><button id="solo">Play vs AI</button><button id="new" class="secondary">New game</button><button id="flip" class="secondary">Flip board</button><button id="undo" class="secondary">Undo</button></div><p id="status">Choose a mode to begin.</p><div class="board" id="board"></div><p class="muted">Tap a piece, then its destination. AI responds after your move.</p></section></main><script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script><script>
const GAME_ID='playovia-chess',GAME_TITLE='Chess Arena';let game=new Chess(),selected=null,flip=false,mode='solo',myColor='w',remote=false;const pieces={'wK':'♔','wQ':'♕','wR':'♖','wB':'♗','wN':'♘','wP':'♙','bK':'♚','bQ':'♛','bR':'♜','bB':'♝','bN':'♞','bP':'♟'};function draw(){let b=document.getElementById('board');b.innerHTML='';let files=flip?'hgfedcba':'abcdefgh',ranks=flip?'12345678':'87654321';for(let r of ranks)for(let f of files){let sq=f+r,el=document.createElement('button');el.className='sq '+((files.indexOf(f)+ranks.indexOf(r))%2?'dark':'light')+(selected===sq?' sel':'');let p=game.get(sq);el.textContent=p?pieces[p.color+p.type.toUpperCase()]||'':'';el.onclick=()=>tap(sq);b.append(el)}document.getElementById('status').textContent=game.game_over()?(game.in_checkmate()?'Checkmate!': 'Draw!'):(game.turn()==='w'?'White':'Black')+' to move'+(game.in_check()?' · Check':'');}function tap(sq){if(mode==='multi'&&game.turn()!==myColor)return;let p=game.get(sq);if(selected){let m=game.move({from:selected,to:sq,promotion:'q'});selected=null;if(m){draw();if(mode==='multi')Net.send({fen:game.fen(),pgn:game.pgn(),last:m.san}).catch(()=>{});else if(!game.game_over())setTimeout(ai,250);return}}if(p&&p.color===game.turn())selected=sq;draw()}function ai(){let ms=game.moves();if(!ms.length)return;let best=ms[Math.floor(Math.random()*ms.length)];let capture=ms.filter(x=>x.includes('x'));if(capture.length&&Math.random()<.65)best=capture[Math.floor(Math.random()*capture.length)];game.move(best);draw()}function reset(){game.reset();selected=null;draw()}document.getElementById('solo').onclick=()=>{mode='solo';myColor='w';reset()};document.getElementById('new').onclick=reset;document.getElementById('flip').onclick=()=>{flip=!flip;draw()};document.getElementById('undo').onclick=()=>{game.undo();if(mode==='solo')game.undo();draw()};draw();</script></body></html>
