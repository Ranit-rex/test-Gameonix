<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Bobble League — Playovia</title><style>*{box-sizing:border-box}body{margin:0;background:#101827;color:#f4f6ff;font:15px system-ui}.wrap{max-width:1000px;margin:auto;padding:16px}.panel{background:#1b2940;border:1px solid #344765;border-radius:16px;padding:14px;margin:12px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}button,input,select{font:inherit}button{border:0;border-radius:10px;padding:10px 14px;background:#8058ed;color:white;font-weight:800}input,select{background:#101827;color:white;border:1px solid #536783;padding:10px;border-radius:9px;width:120px}canvas{display:block;width:100%;max-height:65vh;touch-action:none;border-radius:15px}#lobby[hidden]{display:none}.muted{color:#aab8d0;font-size:13px}.roomjoin{margin:4px;background:#354765}</style></head><body><main class="wrap"><h1>⚽ Bobble League</h1><section class="panel"><div class="actions"><button id="solo">Solo vs AI</button><button id="new">New match</button><select id="formation"><option value="balanced">Balanced</option><option value="attack">Attack</option><option value="defence">Defence</option></select><select id="length"><option value="1">Scrimmage · 1 goal</option><option value="3">Qualifier · 3 goals</option><option value="5">Champion · 5 goals</option></select><button id="power">Power play</button></div><p id="turn">Select one of your Bobbles, drag to aim, release to move.</p><canvas id="field" width="900" height="520"></canvas><p class="muted">Original Playovia tabletop football: alternating turns, formations, aim-and-release physics and power plays.</p></section><section class="panel"><h3>Online multiplayer</h3><div class="actions"><button id="create">Create room</button><input id="joinCode" maxlength="8" placeholder="Room code"><button id="join">Join</button><button id="start">Start match</button><button id="leave">Leave</button></div><p id="netStatus" class="muted">Connect when ready.</p><div id="lobby" hidden>Room <b id="roomCode"></b><p id="roomMembers"></p></div><div id="roomList" class="muted"></div><button id="refresh">Find rooms</button></section></main><script src="../../../../shared/multiplayer.js"></script><script src="../online.js"></script><script>
const GAME_ID='playovia-bobble-league',GAME_TITLE='Bobble League';const cv=document.getElementById('field'),ctx=cv.getContext('2d');let units=[],mode='solo',turn=0,selected=null,aim=null,goals=[0,0],target=1,formation='balanced',power=false,anim=false;function setup(){formation=document.getElementById('formation').value;goals=[0,0];turn=0;units=[];let ours=formation==='attack'?[ [170,145],[170,260],[170,375],[300,205],[300,315] ]:formation==='defence'?[[170,180],[170,260],[170,340],[290,220],[290,300]]:[[170,150],[170,260],[170,370],[300,180],[300,340]];ours.forEach((p,i)=>units.push({x:p[0],y:p[1],team:0,vx:0,vy:0,i}));[[730,150],[730,260],[730,370],[600,180],[600,340]].forEach((p,i)=>units.push({x:p[0],y:p[1],team:1,vx:0,vy:0,i}));units.push({x:450,y:260,team:2,vx:0,vy:0,i:0});selected=null;draw()}function draw(){ctx.clearRect(0,0,900,520);ctx.fillStyle='#16754d';ctx.fillRect(0,0,900,520);ctx.strokeStyle='#d8f6df';ctx.lineWidth=4;ctx.strokeRect(35,30,830,460);ctx.beginPath();ctx.moveTo(450,30);ctx.lineTo(450,490);ctx.stroke();ctx.beginPath();ctx.arc(450,260,75,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#0c3b2a';ctx.fillRect(0,190,38,140);ctx.fillRect(862,190,38,140);ctx.fillStyle='#eaf4ff';ctx.font='bold 30px system-ui';ctx.fillText(goals[0]+'  -  '+goals[1],405,24);units.forEach((u,i)=>{ctx.beginPath();ctx.fillStyle=u.team===0?'#ffcf48':u.team===1?'#52b6ff':'#fff';ctx.arc(u.x,u.y,u.team===2?13:22,0,Math.PI*2);ctx.fill();ctx.strokeStyle=i===selected?'#fff':'#14362c';ctx.lineWidth=i===selected?5:2;ctx.stroke();ctx.fillStyle='#152b30';ctx.font='bold 12px system-ui';ctx.textAlign='center';ctx.fillText(u.team===2?'●':String(u.i+1),u.x,u.y+4)});if(aim&&selected!==null){ctx.strokeStyle='#fff';ctx.setLineDash([8,6]);ctx.beginPath();ctx.moveTo(units[selected].x,units[selected].y);ctx.lineTo(aim.x,aim.y);ctx.stroke();ctx.setLineDash([])}}function pos(e){let r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*900/r.width,y:(e.clientY-r.top)*520/r.height}}cv.onpointerdown=e=>{if(anim)return;let p=pos(e),idx=units.findIndex(u=>Math.hypot(u.x-p.x,u.y-p.y)<28&&u.team===turn);if(idx>=0){selected=idx;aim=p;cv.setPointerCapture(e.pointerId);draw()}};cv.onpointermove=e=>{if(selected!==null){aim=pos(e);draw()}};cv.onpointerup=e=>{if(selected===null)return;let p=pos(e),u=units[selected],dx=u.x-p.x,dy=u.y-p.y,l=Math.hypot(dx,dy)||1;u.vx=dx/l*Math.min(17,l*.12)*(power?1.5:1);u.vy=dy/l*Math.min(17,l*.12)*(power?1.5:1);power=false;aim=null;selected=null;anim=true;physics()};function physics(){let active=false;for(let u of units){u.x+=u.vx;u.y+=u.vy;u.vx*=.97;u.vy*=.97;if(Math.abs(u.vx)+Math.abs(u.vy)>.08)active=true;else u.vx=u.vy=0;if(u.y<52||u.y>468)u.vy*=-.8;if(u.team!==2&&(u.x<58||u.x>842))u.vx*=-.8}for(let i=0;i<units.length;i++)for(let j=i+1;j<units.length;j++){let a=units[i],b=units[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);if(d&&d<43){let nx=dx/d,ny=dy/d,v=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;if(v>0){a.vx-=v*nx;b.vx+=v*nx;a.vy-=v*ny;b.vy+=v*ny}}}let ball=units[10];if(ball.x<28){goals[1]++;setupRound()}if(ball.x>872){goals[0]++;setupRound()}draw();if(active)requestAnimationFrame(physics);else{anim=false;turn=1-turn;document.getElementById('turn').textContent=(mode==='solo'?'Your turn':'Team '+(turn+1)+' turn')+' · '+goals.join(' - ');if(mode==='multi')Net.send({units,turn,goals}).catch(()=>{});else if(turn===1)setTimeout(ai,600)}}function setupRound(){let g=[...goals];setup();goals=g;if(goals[0]>=target||goals[1]>=target){document.getElementById('turn').textContent='Full time · '+goals.join(' - ');anim=true}}function ai(){let ball=units[10],bot=units.filter(u=>u.team===1).sort((a,b)=>Math.hypot(a.x-ball.x,a.y-ball.y)-Math.hypot(b.x-ball.x,b.y-ball.y))[0];bot.vx=(ball.x-bot.x)*.06;bot.vy=(ball.y-bot.y)*.06;anim=true;physics()}window.onRemoteState=v=>{if(mode==='multi'&&v.units){units=v.units;turn=v.turn||0;goals=v.goals||[0,0];draw()}};document.getElementById('solo').onclick=()=>{mode='solo';setup()};document.getElementById('new').onclick=setup;document.getElementById('formation').onchange=setup;document.getElementById('length').onchange=e=>target=+e.target.value;document.getElementById('power').onclick=()=>{power=true;document.getElementById('turn').textContent='Power play armed for next move!'};document.getElementById('create').onclick=()=>Net.create().catch(e=>Net.status(e.message));document.getElementById('join').onclick=()=>Net.join(document.getElementById('joinCode').value.trim().toUpperCase()).then(()=>mode='multi').catch(e=>Net.status(e.message));document.getElementById('start').onclick=()=>{mode='multi';setup();Net.start({units,turn,goals}).catch(e=>Net.status(e.message))};document.getElementById('leave').onclick=()=>Net.leave();document.getElementById('refresh').onclick=()=>Net.rooms().catch(e=>Net.status(e.message));setup();</script></body></html>
