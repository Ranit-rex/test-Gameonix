<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>8 Ball Pool — Playovia</title><style>*{box-sizing:border-box}body{margin:0;background:#101827;color:#f4f6ff;font:15px system-ui}.wrap{max-width:1000px;margin:auto;padding:16px}.panel{background:#1b2940;border:1px solid #344765;border-radius:16px;padding:14px;margin:12px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}button,input{font:inherit}button{border:0;border-radius:10px;padding:10px 14px;background:#8058ed;color:white;font-weight:800}input{background:#101827;color:white;border:1px solid #536783;padding:10px;border-radius:9px;width:120px}canvas{display:block;width:100%;max-height:68vh;touch-action:none;background:#075c43;border-radius:16px;border:10px solid #583a25}#lobby[hidden]{display:none}.muted{color:#aab8d0;font-size:13px}.roomjoin{margin:4px;background:#354765}</style></head><body><main class="wrap"><h1>🎱 8 Ball Pool</h1><section class="panel"><div class="actions"><button id="solo">Solo vs AI</button><button id="rack">New rack</button><button id="shoot">Shoot</button></div><p id="turn">Aim by dragging from cue ball backwards, release to shoot.</p><canvas id="table" width="900" height="500"></canvas><p class="muted">Touch or mouse: pull back from the cue ball and release. Pocket the 8-ball last.</p></section><section class="panel"><h3>Online multiplayer</h3><div class="actions"><button id="create">Create room</button><input id="joinCode" maxlength="8" placeholder="Room code"><button id="join">Join</button><button id="start">Start match</button><button id="leave">Leave</button></div><p id="netStatus" class="muted">Connect when ready.</p><div id="lobby" hidden>Room <b id="roomCode"></b><p id="roomMembers"></p></div><div id="roomList" class="muted"></div><button id="refresh">Find rooms</button></section></main><script src="../../../../shared/multiplayer.js"></script><script src="../online.js"></script><script>
const GAME_ID='playovia-pool',GAME_TITLE='8 Ball Pool';const cv=document.getElementById('table'),ctx=cv.getContext('2d'),W=900,H=500,R=13;let balls=[],aim=null,mode='solo',turn=0,drag=false,moving=false,me=0;const pockets=[[22,22],[450,17],[878,22],[22,478],[450,483],[878,478]];function rack(){balls=[{x:205,y:250,vx:0,vy:0,n:0,cue:true}];let n=1;for(let row=0;row<5;row++)for(let col=0;col<=row;col++){let x=600+row*23,y=250+(col-row/2)*27;balls.push({x,y,vx:0,vy:0,n,cue:false});n++}moving=false;draw()}function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#08724e';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#d6b27b';ctx.lineWidth=3;ctx.strokeRect(18,18,864,464);pockets.forEach(([x,y])=>{ctx.fillStyle='#07110e';ctx.beginPath();ctx.arc(x,y,23,0,Math.PI*2);ctx.fill()});balls.forEach(b=>{if(b.pocket)return;ctx.beginPath();ctx.fillStyle=b.cue?'#fff':b.n===8?'#111':b.n%2?'#f5e6c8':'#e6b12e';ctx.arc(b.x,b.y,R,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#ddd';ctx.stroke();if(!b.cue){ctx.fillStyle=b.n===8?'white':'#222';ctx.font='10px Arial';ctx.textAlign='center';ctx.fillText(b.n,b.x,b.y+3)}});if(aim){let c=balls[0];ctx.strokeStyle='#fff';ctx.setLineDash([8,7]);ctx.beginPath();ctx.moveTo(c.x,c.y);ctx.lineTo(c.x+(c.x-aim.x)*2,c.y+(c.y-aim.y)*2);ctx.stroke();ctx.setLineDash([])}}function point(e){let r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}cv.onpointerdown=e=>{if(moving)return;aim=point(e);drag=true;cv.setPointerCapture(e.pointerId);draw()};cv.onpointermove=e=>{if(drag){aim=point(e);draw()}};cv.onpointerup=e=>{if(!drag)return;drag=false;let p=point(e),c=balls[0],dx=c.x-p.x,dy=c.y-p.y,len=Math.hypot(dx,dy)||1,power=Math.min(22,len*.12);c.vx=dx/len*power;c.vy=dy/len*power;aim=null;moving=true;animate();};function animate(){let active=false;for(let b of balls){if(b.pocket)continue;b.x+=b.vx;b.y+=b.vy;b.vx*=.986;b.vy*=.986;if(Math.abs(b.vx)+Math.abs(b.vy)>.05)active=true;else b.vx=b.vy=0;if(b.x<34||b.x>866)b.vx*=-.88;if(b.y<34||b.y>466)b.vy*=-.88;for(let q of pockets)if(Math.hypot(b.x-q[0],b.y-q[1])<20){if(b.cue){b.x=205;b.y=250;b.vx=b.vy=0}else b.pocket=true}}for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++){let a=balls[i],b=balls[j];if(a.pocket||b.pocket)continue;let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);if(d&&d<2*R){let nx=dx/d,ny=dy/d,dv=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;if(dv>0){a.vx-=dv*nx;b.vx+=dv*nx;a.vy-=dv*ny;b.vy+=dv*ny}}}draw();if(active)requestAnimationFrame(animate);else{moving=false;turn=1-turn;document.getElementById('turn').textContent=(mode==='solo'?'Your turn':'Player '+(turn+1)+' turn');if(mode==='multi')Net.send({balls,turn}).catch(()=>{});else if(turn===1)setTimeout(ai,700)}}function ai(){let target=balls.find(b=>!b.cue&&!b.pocket);if(!target)return;let c=balls[0];c.vx=(target.x-c.x)*.045;c.vy=(target.y-c.y)*.045;moving=true;animate()}window.onRemoteState=v=>{if(mode==='multi'&&v.balls){balls=v.balls;turn=v.turn||0;draw()}};document.getElementById('solo').onclick=()=>{mode='solo';turn=0;rack()};document.getElementById('rack').onclick=rack;document.getElementById('shoot').onclick=()=>{let c=balls[0];if(!moving){c.vx=9;c.vy=-2;moving=true;animate()}};document.getElementById('create').onclick=()=>Net.create().catch(e=>Net.status(e.message));document.getElementById('join').onclick=()=>Net.join(document.getElementById('joinCode').value.trim().toUpperCase()).then(()=>{mode='multi';me=1}).catch(e=>Net.status(e.message));document.getElementById('start').onclick=()=>{mode='multi';turn=0;rack();Net.start({balls,turn}).catch(e=>Net.status(e.message))};document.getElementById('leave').onclick=()=>Net.leave();document.getElementById('refresh').onclick=()=>Net.rooms().catch(e=>Net.status(e.message));rack();</script></body></html>
