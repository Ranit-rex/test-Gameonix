<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>8 Ball Pool — Playovia</title>
<style>
:root{color-scheme:dark;--bg:#080d18;--panel:#121c2d;--line:#263750;--muted:#9fb0c8;--accent:#8b6cff;--gold:#ffc857}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -20%,#26375b 0%,#101a2b 42%,var(--bg) 78%);color:#f6f7ff;font:15px/1.5 Inter,system-ui,sans-serif}
.wrap{width:min(1100px,100%);margin:auto;padding:clamp(14px,3vw,30px)}
h1{font-size:clamp(26px,5vw,42px);letter-spacing:-1.5px;margin:0;font-weight:900}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:8px 0 22px}
.panel{background:linear-gradient(145deg,rgba(24,38,60,.97),rgba(13,23,39,.98));border:1px solid var(--line);border-radius:22px;padding:clamp(14px,2.5vw,24px);margin:14px 0;box-shadow:0 18px 55px #0005}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button,input,select{font:inherit}button{border:1px solid transparent;border-radius:12px;padding:11px 17px;background:linear-gradient(135deg,#9a79ff,#6545dc);color:white;font-weight:800;cursor:pointer;box-shadow:0 6px 18px #6045c933;transition:transform .15s,filter .15s}
button:hover{filter:brightness(1.12);transform:translateY(-1px)}button:active{transform:translateY(1px)}.secondary{background:#263852;border-color:#3a506f;box-shadow:none}
.muted{color:var(--muted);font-size:13px}#status,#turn{font-size:16px;font-weight:750;color:#fff;min-height:26px}
.board{width:min(92vw,610px);aspect-ratio:1;display:grid;grid-template-columns:repeat(8,1fr);margin:20px auto;border:8px solid #2d3d54;border-radius:13px;overflow:hidden;box-shadow:0 18px 48px #0008}
.sq{display:grid;place-items:center;border-radius:0;padding:0;font-size:clamp(24px,7.5vw,58px);cursor:pointer;user-select:none;box-shadow:none}
.light{background:#e8dfcc;color:#1b2738}.dark{background:#72917e;color:#fff}.sel{box-shadow:inset 0 0 0 5px #ffd34d}.legal{background-image:radial-gradient(#40c982 24%,transparent 27%)}
input,select{background:#0c1524;color:white;border:1px solid #3b506c;padding:11px 13px;border-radius:11px}
canvas{display:block;width:100%;max-height:68vh;touch-action:none;background:#075c43;border-radius:18px;border:10px solid #61452f;box-shadow:0 18px 48px #0008}
@media(max-width:600px){.wrap{padding:12px}.panel{border-radius:17px;padding:13px}.actions button{flex:1 1 auto}.board{border-width:5px}.sq{font-size:clamp(22px,8vw,42px)}}
</style></head><body><main class="wrap"><h1>🎱 8 Ball Pool</h1><section class="panel"><div class="actions"><button id="solo">Solo vs AI</button><button id="rack">New rack</button><button id="shoot">Shoot</button></div><p id="turn">Aim by dragging from cue ball backwards, release to shoot.</p><canvas id="table" width="900" height="500"></canvas><p class="muted">Touch or mouse: pull back from the cue ball and release. Pocket the 8-ball last.</p></section></main><script>
const GAME_ID='playovia-pool',GAME_TITLE='8 Ball Pool';const cv=document.getElementById('table'),ctx=cv.getContext('2d'),W=900,H=500,R=13;let balls=[],aim=null,mode='solo',turn=0,drag=false,moving=false,me=0;const pockets=[[22,22],[450,17],[878,22],[22,478],[450,483],[878,478]];function rack(){balls=[{x:205,y:250,vx:0,vy:0,n:0,cue:true}];let n=1;for(let row=0;row<5;row++)for(let col=0;col<=row;col++){let x=600+row*23,y=250+(col-row/2)*27;balls.push({x,y,vx:0,vy:0,n,cue:false});n++}moving=false;draw()}function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#08724e';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#d6b27b';ctx.lineWidth=3;ctx.strokeRect(18,18,864,464);pockets.forEach(([x,y])=>{ctx.fillStyle='#07110e';ctx.beginPath();ctx.arc(x,y,23,0,Math.PI*2);ctx.fill()});balls.forEach(b=>{if(b.pocket)return;ctx.beginPath();ctx.fillStyle=b.cue?'#fff':b.n===8?'#111':b.n%2?'#f5e6c8':'#e6b12e';ctx.arc(b.x,b.y,R,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#ddd';ctx.stroke();if(!b.cue){ctx.fillStyle=b.n===8?'white':'#222';ctx.font='10px Arial';ctx.textAlign='center';ctx.fillText(b.n,b.x,b.y+3)}});if(aim){let c=balls[0];ctx.strokeStyle='#fff';ctx.setLineDash([8,7]);ctx.beginPath();ctx.moveTo(c.x,c.y);ctx.lineTo(c.x+(c.x-aim.x)*2,c.y+(c.y-aim.y)*2);ctx.stroke();ctx.setLineDash([])}}function point(e){let r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}cv.onpointerdown=e=>{if(moving)return;aim=point(e);drag=true;cv.setPointerCapture(e.pointerId);draw()};cv.onpointermove=e=>{if(drag){aim=point(e);draw()}};cv.onpointerup=e=>{if(!drag)return;drag=false;let p=point(e),c=balls[0],dx=c.x-p.x,dy=c.y-p.y,len=Math.hypot(dx,dy)||1,power=Math.min(22,len*.12);c.vx=dx/len*power;c.vy=dy/len*power;aim=null;moving=true;animate();};function animate(){let active=false;for(let b of balls){if(b.pocket)continue;b.x+=b.vx;b.y+=b.vy;b.vx*=.986;b.vy*=.986;if(Math.abs(b.vx)+Math.abs(b.vy)>.05)active=true;else b.vx=b.vy=0;if(b.x<34||b.x>866)b.vx*=-.88;if(b.y<34||b.y>466)b.vy*=-.88;for(let q of pockets)if(Math.hypot(b.x-q[0],b.y-q[1])<20){if(b.cue){b.x=205;b.y=250;b.vx=b.vy=0}else b.pocket=true}}for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++){let a=balls[i],b=balls[j];if(a.pocket||b.pocket)continue;let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);if(d&&d<2*R){let nx=dx/d,ny=dy/d,dv=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;if(dv>0){a.vx-=dv*nx;b.vx+=dv*nx;a.vy-=dv*ny;b.vy+=dv*ny}}}draw();if(active)requestAnimationFrame(animate);else{moving=false;turn=1-turn;document.getElementById('turn').textContent=(mode==='solo'?'Your turn':'Player '+(turn+1)+' turn');if(mode==='multi')Net.send({balls,turn}).catch(()=>{});else if(turn===1)setTimeout(ai,700)}}function ai(){let target=balls.find(b=>!b.cue&&!b.pocket);if(!target)return;let c=balls[0];c.vx=(target.x-c.x)*.045;c.vy=(target.y-c.y)*.045;moving=true;animate()}document.getElementById('solo').onclick=()=>{mode='solo';turn=0;rack()};document.getElementById('rack').onclick=rack;document.getElementById('shoot').onclick=()=>{let c=balls[0];if(!moving){c.vx=9;c.vy=-2;moving=true;animate()}};rack();</script></body></html>
