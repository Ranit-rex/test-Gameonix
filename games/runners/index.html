<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PlayHub — City Rush</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07151b;color:#fff;font-family:Arial,sans-serif;touch-action:none}canvas{display:block}#hud{position:fixed;z-index:3;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;pointer-events:none}.pill{background:#071923d9;border:1px solid #ffffff35;border-radius:14px;padding:10px 14px;backdrop-filter:blur(8px);font-weight:700}.score{font-size:21px;color:#ffdc59}#coins{color:#ffdc59;font-size:13px;line-height:1.15}#pause{position:fixed;z-index:4;right:14px;top:76px;background:#102c38;color:#fff;border:1px solid #ffffff44;border-radius:10px;padding:9px 13px;font-weight:bold}#overlay{position:fixed;z-index:8;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;background:linear-gradient(#07151b9c,#07151be8);text-align:center}.card{width:min(440px,96vw);padding:26px 22px;border-radius:22px;background:#102b38ed;border:1px solid #ffffff30;box-shadow:0 22px 70px #0009}.card h1{font-size:clamp(30px,8vw,44px);color:#ffd34d;margin:0 0 8px}.card p{color:#d4e4e9;line-height:1.55}.mainbtn{border:0;border-radius:12px;padding:14px 25px;background:#ffd04a;color:#18232a;font-weight:900;font-size:16px}#loading{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:#07151b;text-align:center;padding:25px}#loading small{color:#b5cbd3}#mobile{position:fixed;z-index:5;left:0;right:0;bottom:18px;display:flex;justify-content:space-between;padding:0 16px;pointer-events:none}.pad{display:flex;gap:9px}.ctrl{pointer-events:auto;width:58px;height:58px;border-radius:50%;border:1px solid #ffffff66;background:#092432d9;color:white;font-size:22px;font-weight:bold}#hint{position:fixed;z-index:2;bottom:88px;left:0;right:0;text-align:center;font-size:11px;color:#fff;opacity:.7;pointer-events:none}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
<div id="hud"><div class="pill">🏃 PLAYHUB</div><div class="pill"><div class="score">SCORE <span id="score">0</span></div><div id="coins">🪙 0</div></div></div>
<button id="pause">Ⅱ PAUSE</button><div id="hint">SWIPE OR USE BUTTONS · ← → MOVE · ↑ JUMP · ↓ SLIDE</div>
<div id="mobile"><div class="pad"><button class="ctrl" id="left">◀</button><button class="ctrl" id="right">▶</button></div><div class="pad"><button class="ctrl" id="slide">▼</button><button class="ctrl" id="jump">▲</button></div></div>
<div id="loading"><div><h2>Loading City Rush…</h2><small id="loadmsg">Preparing 3D models</small></div></div>
<div id="overlay" style="display:none"><div class="card"><h1 id="title">JUNGLE RUNNER</h1><p id="message">Sprint through the neon city, dodge traffic and collect coins.</p><button class="mainbtn" id="start">START RUNNING</button><p style="font-size:11px">A PLAYHUB GAME</p></div></div>
<script type="module">
import * as THREE from 'three';

const $=id=>document.getElementById(id);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bc9e8);scene.fog=new THREE.Fog(0x9bc9e8,48,175);
const camera=new THREE.PerspectiveCamera(64,innerWidth/innerHeight,.1,220);camera.position.set(0,5.2,10);camera.lookAt(0,1,-4);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xd9f5ff,0x30452a,2.0));const sun=new THREE.DirectionalLight(0xffedcf,3.1);sun.position.set(-12,22,9);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const mat=(c,r=.9)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
const groundMat=mat(0x4a5960),roadMat=mat(0x303943),edgeMat=mat(0x9daab2),lineMat=mat(0xf4e7ad);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(260,260),groundMat);ground.rotation.x=-Math.PI/2;ground.position.y=-.2;ground.receiveShadow=true;scene.add(ground);
const road=new THREE.Mesh(new THREE.BoxGeometry(8.2,.24,220),roadMat);road.position.set(0,-.05,-82);road.receiveShadow=true;scene.add(road);
for(const x of [-4.22,4.22]){const curb=new THREE.Mesh(new THREE.BoxGeometry(.32,.34,220),edgeMat);curb.position.set(x,.02,-82);scene.add(curb);const walk=new THREE.Mesh(new THREE.BoxGeometry(2.1,.16,220),mat(0x92999a));walk.position.set(x*1.55,-.01,-82);scene.add(walk)}
const laneMarks=[];for(let z=18;z>-205;z-=9)for(const x of [-1.36,1.36]){const m=new THREE.Mesh(new THREE.BoxGeometry(.075,.025,3.8),lineMat);m.position.set(x,.09,z);scene.add(m);laneMarks.push(m)}

const loader=new (await import('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js')).GLTFLoader();const models={};
await new Promise((resolve,reject)=>loader.load('./assets/runner_hero.glb',g=>{models.hero=g.scene;models.hero.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});$('loadmsg').textContent='City assets ready · Runner loaded';resolve()},undefined,reject));
function fitModel(source,targetHeight){const g=source.clone(true);g.updateMatrixWorld(true);const b=new THREE.Box3().setFromObject(g);const size=b.getSize(new THREE.Vector3());const center=b.getCenter(new THREE.Vector3());const h=Math.max(size.y,.001);g.position.sub(center);g.scale.setScalar(targetHeight/h);g.position.y=0;g.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});return g}
function addModel(key,height,x,y,z,parent=scene){const g=fitModel(models[key],height);g.position.set(x,y,z);parent.add(g);return g}

// Procedural neon-city block: buildings, lit windows, street lamps and trees.
const scenery=[];const buildingMats=[mat(0x263b55),mat(0x34465d),mat(0x3c405b),mat(0x344e58),mat(0x51445d)];const windowMat=new THREE.MeshStandardMaterial({color:0xffd783,emissive:0xffb84a,emissiveIntensity:1.1});
function makeBuilding(x,z){const group=new THREE.Group(),w=3.8+Math.random()*2.5,h=8+Math.random()*17,d=5+Math.random()*4;const body=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),buildingMats[Math.floor(Math.random()*buildingMats.length)]);body.position.y=h/2;body.castShadow=true;body.receiveShadow=true;group.add(body);const rows=Math.max(2,Math.floor(h/2.3));for(let y=1.5;y<h-1;y+=2.2)for(let xx=-w/2+.7;xx<w/2-.4;xx+=1.15){const win=new THREE.Mesh(new THREE.PlaneGeometry(.48,.72),windowMat);win.position.set(xx,y,d/2+.012);group.add(win);const sideWin=win.clone();sideWin.rotation.y=Math.PI/2;sideWin.position.set(w/2+.012,y,xx*(d/w));group.add(sideWin)}group.position.set(x,0,z);scene.add(group);return group}
function makeLamp(x,z){const g=new THREE.Group(),pole=new THREE.Mesh(new THREE.CylinderGeometry(.055,.09,5.2,8),mat(0x293541));pole.position.y=2.6;g.add(pole);const arm=new THREE.Mesh(new THREE.BoxGeometry(1.15,.08,.08),mat(0x293541));arm.position.set(x>0?-.48:.48,5.05,0);g.add(arm);const bulb=new THREE.Mesh(new THREE.SphereGeometry(.18,10,8),new THREE.MeshStandardMaterial({color:0xffe5a0,emissive:0xffb84a,emissiveIntensity:2}));bulb.position.set(x>0?-.95:.95,4.95,0);g.add(bulb);g.position.set(x,0,z);scene.add(g);return g}
for(let z=12;z>-205;z-=22){for(const side of [-1,1])scenery.push(makeBuilding(side*(9+Math.random()*4),z+(side===1?-7:0)));if(z%44===12)for(const side of [-1,1])scenery.push(makeLamp(side*5.6,z-8))}
const treeMat=mat(0x28734f);for(let z=4;z>-200;z-=34)for(const side of [-1,1]){const tree=new THREE.Group(),trunk=new THREE.Mesh(new THREE.CylinderGeometry(.16,.23,1.8,7),mat(0x684a36));trunk.position.y=.9;tree.add(trunk);const crown=new THREE.Mesh(new THREE.SphereGeometry(1.15,9,8),treeMat);crown.position.y=2.3;tree.add(crown);tree.position.set(side*6.4,0,z);scene.add(tree);scenery.push(tree)}

// Hero GLB — model contains separate named body meshes for procedural animation
const hero=fitModel(models.hero,2.65);hero.position.set(0,0,4);scene.add(hero);
const parts={};hero.traverse(o=>{if(o.isMesh&&o.name)parts[o.name]=o});
const heroBox=new THREE.Box3().setFromObject(hero);const heroSize=heroBox.getSize(new THREE.Vector3());
// The GLB has no embedded animation clips, so animate its named limbs procedurally.

const obstacles=[],coins=[];let running=false,paused=false,over=false,lane=0,jumpY=0,jumpV=0,sliding=false,slideTimer=0,score=0,coinCount=0,speed=19,spawnTimer=0;
const clock=new THREE.Clock();
function addObstacle(type,l,z){const g=new THREE.Group(),dark=mat(0x27313b),yellow=mat(0xffc447),red=mat(0xd94a48),metal=mat(0x8e9ba4);function box(w,h,d,m,x,y,zz){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,zz);o.castShadow=true;o.receiveShadow=true;g.add(o)}function wheel(x,zz){const o=new THREE.Mesh(new THREE.CylinderGeometry(.24,.24,.16,12),dark);o.rotation.z=Math.PI/2;o.position.set(x,.28,zz);g.add(o)}if(type==='cone'){const base=new THREE.Mesh(new THREE.CylinderGeometry(.43,.48,.12,12),dark);base.position.y=.06;g.add(base);const cone=new THREE.Mesh(new THREE.ConeGeometry(.34,1.12,12),yellow);cone.position.y=.68;g.add(cone);box(.4,.12,.4,red,0,.54,0)}else if(type==='barricade'){for(const x of [-.72,.72]){box(.12,1.15,.14,dark,x,.58,0);box(.2,.15,.2,yellow,x,.12,0)}box(2.0,.34,.24,red,0,.88,0);box(2.0,.13,.27,yellow,0,.88,.02)}else if(type==='overhead'){for(const x of [-.88,.88])box(.13,2.35,.16,metal,x,1.17,0);box(2.0,.35,.35,red,0,2.12,0);box(1.8,.08,.38,yellow,0,1.88,0)}else if(type==='car'){box(1.65,.62,3.05,red,0,.72,0);box(1.32,.72,1.55,metal,0,1.35,-.12);for(const x of [-.88,.88])for(const zz of [-.95,.95])wheel(x,zz);box(.38,.16,.08,yellow,-.5,.83,1.56);box(.38,.16,.08,yellow,.5,.83,1.56)}else if(type==='crate'){box(1.25,1.25,1.25,mat(0x9b6538),0,.65,0);box(1.35,.12,1.35,yellow,0,.65,0)}else if(type==='pothole'){const hole=new THREE.Mesh(new THREE.CylinderGeometry(.78,.78,.07,20),mat(0x111820));hole.position.y=.02;g.add(hole);const rim=new THREE.Mesh(new THREE.TorusGeometry(.76,.09,8,20),metal);rim.rotation.x=Math.PI/2;rim.position.y=.07;g.add(rim)}g.position.set(l*2,0,z);scene.add(g);obstacles.push({mesh:g,type,lane:l})}
function addCoin(l,z){const g=new THREE.Group(),gold=new THREE.MeshStandardMaterial({color:0xffcf35,metalness:.78,roughness:.22,emissive:0x5a3500,emissiveIntensity:.3}),edge=new THREE.MeshStandardMaterial({color:0xffef9a,metalness:.7,roughness:.2});const ring=new THREE.Mesh(new THREE.TorusGeometry(.13,.035,8,18),gold);g.add(ring);const core=new THREE.Mesh(new THREE.CylinderGeometry(.092,.092,.035,16),gold);core.rotation.x=Math.PI/2;g.add(core);const glint=new THREE.Mesh(new THREE.SphereGeometry(.018,6,6),edge);glint.position.set(-.045,.05,.025);g.add(glint);g.position.set(l*2,.92,z);g.scale.setScalar(.72);scene.add(g);coins.push(g)}
function spawnRow(z){const l=Math.floor(Math.random()*3)-1;const types=['cone','barricade','overhead','car','crate','pothole'];const type=types[Math.floor(Math.random()*types.length)];addObstacle(type,l,z);const safeLane=[-1,0,1].filter(x=>x!==l)[Math.floor(Math.random()*2)];for(let i=0;i<4;i++)addCoin(safeLane,z-3-i*1.55)}
function clearObjects(){for(const o of obstacles)scene.remove(o.mesh);for(const c of coins)scene.remove(c);obstacles.length=0;coins.length=0}
function updateHUD(){$('score').textContent=Math.floor(score);$('coins').textContent='🪙 '+coinCount}
function showMenu(title,msg,button){$('title').textContent=title;$('message').textContent=msg;$('start').textContent=button;$('overlay').style.display='flex'}
function startGame(){clearObjects();score=0;coinCount=0;speed=19;lane=0;jumpY=0;jumpV=0;sliding=false;slideTimer=0;spawnTimer=0;over=false;paused=false;hero.position.set(0,0,4);hero.rotation.set(0,0,0);hero.scale.y=1;for(let z=-32;z>-145;z-=22)spawnRow(z);updateHUD();running=true;$('overlay').style.display='none';$('pause').textContent='Ⅱ PAUSE'}
function endGame(){running=false;over=true;showMenu('GAME OVER',`Score: ${Math.floor(score)} · Coins: ${coinCount}`,'PLAY AGAIN')}
function moveLeft(){if(running&&!paused)lane=Math.max(-1,lane-1)}function moveRight(){if(running&&!paused)lane=Math.min(1,lane+1)}function jump(){if(running&&!paused&&jumpY<=0.01&&!sliding)jumpV=10.2}function slide(){if(running&&!paused&&jumpY<=.1){sliding=true;slideTimer=.72}}
function togglePause(){if(!running)return;paused=!paused;$('pause').textContent=paused?'▶ RESUME':'Ⅱ PAUSE'}
$('start').onclick=startGame;$('pause').onclick=togglePause;$('left').onclick=moveLeft;$('right').onclick=moveRight;$('jump').onclick=jump;$('slide').onclick=slide;
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key==='a')moveLeft();if(e.key==='ArrowRight'||e.key==='d')moveRight();if(e.key==='ArrowUp'||e.key==='w'||e.key===' ')jump();if(e.key==='ArrowDown'||e.key==='s')slide();if(e.key==='Escape')togglePause()});
let sx=0,sy=0;renderer.domElement.addEventListener('touchstart',e=>{sx=e.changedTouches[0].clientX;sy=e.changedTouches[0].clientY},{passive:true});renderer.domElement.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;if(Math.abs(dx)>Math.abs(dy)){dx>0?moveRight():moveLeft()}else{dy<0?jump():slide()}},{passive:true});

function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04),t=clock.elapsedTime;
 if(running&&!paused){score+=dt*speed*.55;speed=Math.min(34,19+score*.009);updateHUD();hero.position.x=THREE.MathUtils.damp(hero.position.x,lane*2,11,dt);
  if(jumpV!==0||jumpY>0){jumpV-=25*dt;jumpY+=jumpV*dt;if(jumpY<=0){jumpY=0;jumpV=0}}
  if(sliding){slideTimer-=dt;if(slideTimer<=0)sliding=false}
  hero.position.y=jumpY+(sliding?-.28:0);hero.scale.y=sliding?.78:1;
  const swing=Math.sin(t*speed*.62)*.62;
  if(parts.leg_L)parts.leg_L.rotation.x=swing;if(parts.leg_R)parts.leg_R.rotation.x=-swing;
  if(parts.boot_L)parts.boot_L.rotation.x=swing;if(parts.boot_R)parts.boot_R.rotation.x=-swing;
  if(parts.arm_L)parts.arm_L.rotation.x=-swing*.75;if(parts.arm_R)parts.arm_R.rotation.x=swing*.75;
  if(parts.shoulder_L)parts.shoulder_L.rotation.x=-swing*.5;if(parts.shoulder_R)parts.shoulder_R.rotation.x=swing*.5;
  hero.rotation.z=THREE.MathUtils.damp(hero.rotation.z,Math.sin(t*speed*.3)*.025,5,dt);
  for(const m of laneMarks){m.position.z+=speed*dt;if(m.position.z>17)m.position.z-=190}
  for(const s of scenery){s.position.z+=speed*dt;if(s.position.z>22)s.position.z-=190}
  for(let i=obstacles.length-1;i>=0;i--){const o=obstacles[i];o.mesh.position.z+=speed*dt;if(o.mesh.position.z>9){scene.remove(o.mesh);obstacles.splice(i,1);continue}const depth=o.type==='car'?1.75:o.type==='barricade'?1.35:1.05;const near=Math.abs(o.mesh.position.z-4)<depth,same=Math.abs(o.mesh.position.x-hero.position.x)<.82;if(near&&same){let hit=true;if(o.type==='cone'&&jumpY>1.05)hit=false;if(o.type==='barricade'&&jumpY>1.25)hit=false;if(o.type==='crate'&&jumpY>1.55)hit=false;if(o.type==='pothole'&&jumpY>.55)hit=false;if(o.type==='overhead'&&sliding)hit=false;if(hit){endGame();break}}}
  for(let i=coins.length-1;i>=0;i--){const c=coins[i];c.position.z+=speed*dt;c.rotation.y+=dt*2.8;if(c.position.z>9){scene.remove(c);coins.splice(i,1);continue}if(Math.abs(c.position.z-4)<.9&&Math.abs(c.position.x-hero.position.x)<.58&&Math.abs(c.position.y-(.92+jumpY))<.72){coinCount++;scene.remove(c);coins.splice(i,1);updateHUD()}}
  spawnTimer+=dt;if(spawnTimer>1.55){spawnRow(-170);spawnTimer=0}
 }
 camera.position.x=THREE.MathUtils.damp(camera.position.x,hero.position.x*.22,3,dt);camera.lookAt(hero.position.x*.16,1.15,-4);renderer.render(scene,camera)}

$('loading').style.display='none';showMenu('CITY RUSH','Sprint through the neon city, dodge traffic and collect coins.','START RUNNING');animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body></html>
