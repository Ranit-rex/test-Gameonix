const GUIDE=`<h2>📖 Guidebook</h2>
<details open><summary>🎮 Controls</summary><p><b>📱 Mobile:</b> left joystick = move (8 directions). Right side: ⚔ Attack (hold = auto combo), 🔨 Heavy, ✨ Special, 💨 Dash, 🛡 Block/Parry, ❤ Heal, 💧 Mana, ⤒ Jump. Top-right: ⏸ Pause, 🎒 Bag. Phone landscape mein rakho.</p><p><b>💻 PC:</b> WASD/Arrows move · J attack · K heavy · L special · Shift dash · B block · Space jump · Q heal · E mana · I bag · Esc/P pause. Neeche hotbar mein har skill ka naam aur cooldown dikhta hai.</p></details>
<details><summary>⚔ Combat</summary><p><b>Combo:</b> 3 hits, teesra sabse strong + knockback. <b>Heavy:</b> bada damage, enemy stagger hota hai (25 stamina; Mage: 8 MP). <b>Dash:</b> chhota invincible dash (20 stamina). <b>Jump:</b> ground shockwave aur red circles se bachne ke liye. <b>Block:</b> damage kam karta hai. <b>PARRY:</b> enemy ke hit se bilkul pehle (0.2 sec) block dabao = zero damage + enemy stun + stamina wapas. <b>Crit:</b> random double damage.</p></details>
<details><summary>⏱ Cooldowns</summary><p>🔨 Heavy/Strike = 5s · 💧 Mana potion = 20s · ❤ Heal potion = 40s · ✨ Special (Whirlwind / Shadow Flurry / Fire Nova) = 55s. Button ya hotbar par seconds dikhte hain. Marne par cooldown reset ho jata hai.</p></details>
<details><summary>🧙 Classes & Skills</summary><p><b>Warrior:</b> Whirlwind, Power Strike, Shield Bash, Berserker Mode. <b>Assassin:</b> Shadow Flurry, Shadow Clone, Smoke Guard, Blood Frenzy. <b>Mage:</b> Fire Nova, Arcane Bolt (auto-aim). <b>🏹 Archer:</b> piercing arrows, Multi Shot, Rain of Death. <b>🔱 Trident:</b> trident throw (1 target), Thunder Trident, Giant Ocean Wave. <b>🥷 Ninja:</b> shuriken, Shuriken Storm, 3 Shadow Clones. Naye characters Shop mein milte hain, jitna powerful utna mehnga. Har level up par 1 skill point. Skill Lv3 tak badhta hai. Special tabhi chalega jab pehla skill learn ho (25 MP).</p></details>
<details><summary>🔓 Special Skill Unlock</summary><p>✨ Special (Whirlwind / Shadow Flurry / Fire Nova) pehle se nahi milta: Menu/Pause → Skills mein <b>Unlock (1 point)</b> karo, tabhi chalega. 🔨 Heavy attack hamesha available hai, bas usse upgrade karna hota hai. Special aur Heavy tabhi fire hote hain jab koi enemy range mein ho (cooldown/MP waste nahi). Heal/Mana potion full hone par use nahi hota. Shadow Flurry 12-20 enemies tak teleport-slash karta hai, Mage ke shots auto-aim hote hain, Heavy ek saath 4+ enemies ko hit karta hai.</p></details>
<details><summary>👹 Enemies</summary><p><b>Skeleton</b> talwar · <b>Skeleton Archer</b> dur se arrows (red aim line dikhti hai; map 7+ mein 2, map 12+ mein 3 arrows) · <b>Goblin</b> tez · <b>Zombie</b>/<b>Brute</b> slow par bhaari · <b>Bat</b> dur se screech, chakkar kaatta hai · <b>Vampire</b> 3 blood-bolts, paas aao to teleport · <b>Wraith</b>/<b>Demon</b> magic · <b>Dark Knight</b>/<b>Golem</b> heavy. Melee attack se pehle red zone aur "!" dikhta hai: dash karo, hato ya parry karo.</p></details>
<details><summary>🛡 Elites & Final Boss</summary><p>Har map mein pehle Elite bosses: <span style="color:#4aa8ff">Rare</span> → <span style="color:#b45cff">Epic</span> → <span style="color:#ffa726">Elite</span> (phir repeat). Map 1 mein 3, har map mein +2 (max 15). Har elite ke aas-paas guard monsters hote hain. Sab elites marne ke baad hi boss arena khulta hai. Elites charge karte hain (red lane), gold elite volley bhi chalata hai.</p><p><b>Final boss:</b> entry cutscene, bahut saare guards, idhar-udhar ghoomta aur dash karta hai. Map badhne par naye attacks: summon, meteor rain, triple combo, nova. Boss/elite ka hit lagne par aap peeche dhakel diye jate ho (fallback) aur 0.3 sec stagger hota hai. Bosses aapka damage resist karte hain (late maps aur hard mode mein zyada), isliye parry aur dodge zaroori hai. Mar gaye to boss ka health reset ho jata hai.</p></details>
<details><summary>🌍 Maps & Modifiers</summary><p>15 maps, Easy se Nightmare tak, har map pichle se mushkil. Agla map boss marne par khulta hai. Modifiers: Poison Rain (red circles), Bat Swarms, Frenzied Foes (tez enemies), Darkness, Enemy Rage (zyada damage), Frostbite (aap slow), Regenerating Foes. Late maps mein kai modifiers ek saath.</p></details>
<details><summary>💎 Loot, Bag & Shop</summary><p>Rarity: <span style="color:#9a9a9a">Common</span>, <span style="color:#4aa8ff">Rare</span>, <span style="color:#b45cff">Epic</span>, <span style="color:#ffa726">Legendary</span>. Khali slot mein item auto-equip hota hai, baaki Bag mein jata hai. 🎒 ya I dabao: Equip, Unequip, Sell. Shop mein potions, upgrades aur Mystery Gear milta hai. Chests aur map 1 ke left side mein secret chest bhi hai.</p></details>
<details><summary>⚙ Customize</summary><p>Settings → <b>Edit controls</b>: koi bhi button drag karo, phir usko tap karke us akele button ka <b>Size</b> aur <b>Transparency</b> slider se badlo (Reset button se default). Settings mein sab buttons ke liye global size/transparency, HUD size, volume, weather, shake, HD graphics aur fullscreen bhi hai. Game ke andar Pause → Settings se bhi badal sakte ho.</p></details>
<details><summary>💡 Tips</summary><p>1) Pehle archers aur bats ko maaro. 2) Elite ke guards ko alag karke lure karo. 3) Boss ki red lane dekh kar side mein dash karo. 4) Heal 40s ka hai, isliye jaldi mat use karo. 5) Gear Bag se regularly upgrade karo.</p></details>`;
