function enter(q){if(q.on)q.on();say(q.s)}
function begin(n){cp=n;mi=0;mp=0;stage=n==1?1:4;TT=4;LAMB=null;BEA=[];ECL=0;if(n==5){door.open=false;BK.x=66;BK.y=140;idol.got=false;logs.forEach(l=>l.v*=1.4)}enter(CHS[n][0])}
function adv(){const q=CHS[cp][mi];if(q.r)q.r();mi++;mp=0;savePro(true);if(mi>=CHS[cp].length)chDone();else enter(CHS[cp][mi])}
function chDone(){proCheckAch();savePro();say(CHL[cp].d);SV.ch=Math.min(10,Math.max(SV.ch,cp+1));try{localStorage.setItem('veer2',SV.ch)}catch(e){}if(cp<10){const n=cp+1;mode='wait';setTimeout(()=>{mode='play';begin(n)},5500)}else{mode='end';setTimeout(()=>menu('You finished all 10 chapters and saved the land from the shadow. Coins: '+coins),5500)}}

  else if(id=='sun'){proToast('🌞 The Legendary Sun Sword only drops from the hidden Golden Golem!');return}
  openPanel('shop');return}
 if(a=='sell-potion'){if(pot>0){pot--;coins+=4;sfx('coin');}openPanel('shop');return}
 if(a.indexOf('spend-')==0){const k=a.slice(6);if(skillPts>0&&skTree[k]<5){skillPts--;skTree[k]++;if(k=='tough'){P.max+=10;P.hp+=10;}sfx('level');proToast('⬆️ '+(k=='pow'?'Power':k=='swift'?'Swift':'Tough')+' is now Lv'+skTree[k]+'!');}openPanel('character');return}

 if(a.indexOf('hair-')==0){hair=a.slice(5);proApplyOutfit();sfx('coin');openPanel('character');return}
 if(a=='toggle-pet'){if(!petUnlocked){proToast('🔒 Unlock Chintu in the Shop first!');return}petOn=!petOn;proToast(petOn?'🐶 Chintu is following you!':'🐶 Chintu is resting.');openPanel('character');return}
 if(a.indexOf('cast-')==0){castSkill(a.slice(5));openPanel('character');return}
 if(a=='toggle-sfx'){sfxOn=!sfxOn;openPanel('settings');return}
 if(a=='toggle-music'){musicOn=!musicOn;openPanel('settings');return}
 if(a=='save-now'){savePro();openPanel(proPanelTab);return}
 if(a=='reset-save'){if(confirm('Erase your PRO save and start fresh?')){try{localStorage.removeItem('veerProSave')}catch(e){}location.reload();}return}
 if(a=='how'){const t=document.getElementById('howText');if(t)t.style.display=t.style.display=='none'?'block':'none';return}
 if(a=='quit-menu'){savePro(true);closePanel();LV='main';menu();return}
}

co('Collect iron ore: ','o',3,752,876,84,184,'Take your lantern into the dark cave and collect three iron ore.','अपनी लालटेन लेकर अँधेरी गुफ़ा में जाओ और लोहे के तीन टुकड़े इकट्ठा करो।'),
co('Collect Sun Runes: ','r',3,1060,1460,590,1050,'Now bring three Sun Runes from the ruins. Scorpions and bats guard them.','अब खंडहर से तीन सूर्य-रूण लाओ। बिच्छू और चमगादड़ उनकी रखवाली करते हैं।',()=>{sp('c',5,1060,1460,590,1050,2,5,101);sp('t',4,1060,1460,590,1050,1,4,101)}),
ta('Give the materials to Bhima (tap INSPECT)','SMITH','Bhima forges the sun armour. You feel stronger than ever.','भीम सूर्य-कवच बनाता है। तुम पहले से कहीं ज़्यादा ताक़तवर महसूस करते हो।',()=>{lv.stk++;lv.lan++;P.max+=20;P.hp=P.max}),
ta('Find Captain Arjun near the citadel (open the map)','ARJ','A long road lies ahead. Cross the bridges, follow the blue pin and visit Sun Shrines on the way.','आगे लंबा सफ़र है। पुल पार करो, नीले निशान के पीछे चलो और रास्ते में सूर्य तीर्थ पर रुको।',0,()=>{WPT={x:NP2.ARJ.x,y:NP2.ARJ.y+30}}),
hu('Clear the citadel guards: ',102,'W',8,2700,3100,2050,2350,4,'Arjun says the Queen’s guards never sleep. Defeat eight wolves.','अर्जुन कहते हैं कि रानी के पहरेदार कभी नहीं सोते। आठ भेड़िये हराओ।',()=>{ECL=1}),
hu('Clear the shadow bats: ',103,'t',10,2700,3100,2050,2350,1,'Shadow bats fill the sky. Defeat ten of them.','आसमान साये वाले चमगादड़ों से भर गया है। दस को हराओ।'),
bcn('Break the Queen’s seals: ',BPOS7,'Three seals hold the Queen’s power. Walk close and tap INSPECT to break each one.','तीन मुहरें रानी की ताक़त को थामे हैं। हर एक के पास जाकर INSPECT दबाओ और उसे तोड़ दो।'),
bo('Defeat the Shadow Queen','E',2900,2215,36,'SHADOW QUEEN','The seals shatter and the Shadow Queen rises! She calls bats. Dodge with DASH and strike again and again.','मुहरें टूट गईं और छाया-रानी उठ खड़ी हुई! वह चमगादड़ बुलाती है। DASH से बचो और बार-बार वार करो।'),
ta('Talk to Captain Arjun (tap INSPECT)','ARJ','The Queen fades into light. Arjun cheers. Go home, Veer, the sun is rising.','रानी रोशनी में घुल गई। अर्जुन ख़ुशी से झूम उठते हैं। घर चलो, वीर, सूरज उग रहा है।',()=>{ECL=0}),
ta('Hear Kavi’s song (tap INSPECT)','KAVI','Kavi the poet sings of your journey. The whole land listens.','कवि तुम्हारी यात्रा का गीत गाता है। पूरा देश सुन रहा है।',()=>{coins+=40}),
ta(RE,'ELD','The elder smiles with tears: the Sun Temple shines brighter than ever. Thank you, Veer.','बुज़ुर्ग आँखों में आँसू लिए मुस्कुराते हैं: सूर्य मंदिर पहले से ज़्यादा चमक रहा है। शुक्रिया, वीर।',()=>{coins+=100;gems+=5;P.max+=20;P.hp=P.max},()=>{P.x=ELD.x+24;P.y=ELD.y+34;reveal(P.x,P.y,300)})];
