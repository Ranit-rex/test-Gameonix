<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Mini Jet Combat — Playovia</title><desc id="desc">Arcade fighter jets clash in a dramatic sunset sky above the clouds.</desc>
<defs>
 <linearGradient id="sky" x2="0.15" y2="1"><stop stop-color="#07142f"/><stop offset=".48" stop-color="#173b70"/><stop offset="1" stop-color="#f0783c"/></linearGradient>
 <radialGradient id="sun"><stop stop-color="#ffe6a1" stop-opacity=".95"/><stop offset=".35" stop-color="#ff9b52" stop-opacity=".5"/><stop offset="1" stop-color="#ff6b39" stop-opacity="0"/></radialGradient>
 <linearGradient id="metal" x2=".2" y2="1"><stop stop-color="#f5fbff"/><stop offset=".42" stop-color="#8ca9c8"/><stop offset="1" stop-color="#263b62"/></linearGradient>
 <linearGradient id="wing" x2="1" y2="1"><stop stop-color="#ff5b48"/><stop offset="1" stop-color="#8c1e38"/></linearGradient>
 <linearGradient id="flame" x2="1"><stop stop-color="#fff4b0"/><stop offset=".35" stop-color="#ffb33e"/><stop offset="1" stop-color="#ff4d2d" stop-opacity="0"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="920" cy="280" r="250" fill="url(#sun)"/>
<path d="M0 330Q180 230 360 330T720 300T1200 260V675H0Z" fill="#101e3c" opacity=".7"/>
<path d="M0 430Q170 340 330 420T660 390T980 360T1200 390V675H0Z" fill="#172744"/>
<path d="M0 515Q180 430 360 500T720 470T1040 450T1200 490V675H0Z" fill="#0a1730"/>
<g fill="#d7e7ff" opacity=".2" filter="url(#blur)"><ellipse cx="110" cy="420" rx="220" ry="38"/><ellipse cx="850" cy="470" rx="310" ry="55"/><ellipse cx="1080" cy="390" rx="180" ry="35"/></g>
<g stroke="#8bdcff" stroke-width="3" opacity=".45" fill="none"><path d="M-30 180 300 80M-20 215 250 135M900 90 1220 20"/><path d="M0 590 450 500M780 610 1200 520"/></g>
<!-- distant enemy aircraft -->
<g transform="translate(860 145) scale(.42) rotate(-13)" opacity=".9" fill="#182b4a" stroke="#ff8a58" stroke-width="5">
 <path d="M-190 10 0-18 125-135 150-128 105-15 210 18 205 38 95 28 58 115 32 120 30 32-150 70Z"/>
 <path d="M-185 14-300 55-290 72-145 45Z" fill="#ff7048"/>
</g>
<g transform="translate(1040 235) scale(.3) rotate(18)" opacity=".8" fill="#182b4a" stroke="#ff8a58" stroke-width="7">
 <path d="M-190 10 0-18 125-135 150-128 105-15 210 18 205 38 95 28 58 115 32 120 30 32-150 70Z"/>
</g>
<!-- laser streaks -->
<path d="M770 175 1110 70" stroke="#ff734c" stroke-width="5" opacity=".8" filter="url(#glow)"/>
<path d="M650 205 1040 135" stroke="#71dcff" stroke-width="3" opacity=".8"/>
<!-- explosion -->
<g transform="translate(180 300)" filter="url(#glow)"><circle r="52" fill="#ff6b32" opacity=".18"/><path d="M0-55 13-20 44-38 28-5 62 8 25 20 39 52 5 31-13 62-18 25-53 38-31 5-62-12-23-18Z" fill="#ff9b40"/><circle r="19" fill="#fff0b2"/></g>
<!-- main fighter -->
<g transform="translate(650 390) rotate(-13)">
 <path d="M-370 42 60-18 340-245 382-230 286-24 430 52 422 83 246 48 160 245 113 252 103 62-290 145Z" fill="url(#metal)" stroke="#e7f4ff" stroke-width="9" stroke-linejoin="round"/>
 <path d="M-65 8 60-18 178-118 202-110 130-5Z" fill="#172b50" stroke="#9bc9e8" stroke-width="5"/>
 <path d="M-330 52-500 125-480 158-275 112Z" fill="url(#wing)" stroke="#ffb18d" stroke-width="5"/>
 <path d="M-350 72-535 145" stroke="url(#flame)" stroke-width="30" stroke-linecap="round" filter="url(#glow)"/>
 <path d="M-120 55 90 20 210 70 90 91Z" fill="#dceeff" opacity=".45"/>
 <path d="M-10 12 120-12" stroke="#fff" stroke-width="8" opacity=".8"/>
 <path d="M-30 30 82 12" stroke="#ff5149" stroke-width="13"/>
 <path d="M-205 90 75 45" stroke="#243d65" stroke-width="8" opacity=".7"/>
 <path d="M-5-3 55-17 118-68 130-62 86-1Z" fill="#172b50"/>
 <circle cx="230" cy="39" r="9" fill="#67e4ff" filter="url(#glow)"/>
</g>
<!-- game HUD framing -->
<g fill="none" stroke="#7edfff" stroke-width="2" opacity=".6"><path d="M52 52h62M52 52v62M1148 52h-62M1148 52v62M52 623h62M52 623v-62M1148 623h-62M1148 623v-62"/><circle cx="1015" cy="535" r="45"/><circle cx="1015" cy="535" r="28"/><path d="M1015 475v120M955 535h120"/></g>
<g font-family="Arial,sans-serif" font-weight="900">
 <text x="76" y="104" font-size="22" letter-spacing="7" fill="#9ce8ff">PLAYOVIA  /  ARCADE AIR WARFARE</text>
 <text x="72" y="548" font-size="70" letter-spacing="1" fill="#fff" stroke="#10213c" stroke-width="2" paint-order="stroke">MINI JET COMBAT</text>
 <text x="78" y="592" font-size="20" letter-spacing="6" fill="#b9e9ff">LOCK ON  •  TAKE OFF  •  DOMINATE</text>
</g>
<rect x="70" y="610" width="235" height="5" rx="3" fill="#ff754b"/><rect x="310" y="610" width="90" height="5" rx="3" fill="#7de5ff"/>
</svg>